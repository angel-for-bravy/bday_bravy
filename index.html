<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Bravy! 🤍</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            font-family: 'Poppins', sans-serif, Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.85);
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            max-width: 320px;
            width: 90%;
            animation: fadeIn 1.5s ease-in-out;
        }
        h1 {
            color: #d63384;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #555;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .btn {
            background-color: #ff4d6d;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
            transition: 0.2s;
        }
        .btn:active {
            transform: scale(0.95);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Happy Birthday, Bravy! 🤍</h1>
        <p id="message">Makasih udah jadi orang paling baik, paling sabar, dan paling spesial di hidup aku. Semoga semua impian kamu tercapai ya! ✨</p>
        <button class="btn" onclick="openLove()">Klik Disini 💌</button>
    </div>

    <script>
        function openLove() {
            document.getElementById("message").innerHTML = "I Love You So Much, Bravy! 🤍<br><br>— Dari Angel yang paling sayang sama kamu —";
        }
    </script>

</body>
</html>
